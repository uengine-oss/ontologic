[project]
name = "kinetic-action"
version = "0.1.0"
description = "온톨로지 키네틱 액션 레이어 — 그래프 인스턴스 대상 정책·계획·승인·실행"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.12,<2",
    "neo4j>=5.20",
    "cel-python>=0.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.uv]
package = false
